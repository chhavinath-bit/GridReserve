<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GridReserve</title>
    <script>
      // Set the theme before the first paint, so a dark-mode user never sees a white flash.
      // Only the theme preference lives in localStorage (DESIGN_SYSTEM §8), never tokens.
      try {
        var t = localStorage.getItem('gr-theme')
        var dark = t === 'dark' || ((t === null || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
