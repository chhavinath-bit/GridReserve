name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles every module and runs all unit and integration tests
      # (Testcontainers works on GitHub's Ubuntu runners, which have Docker).
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Node version from frontend/.nvmrc (24 LTS); npm cache keyed on package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact locked versions
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

  images:
    name: Image ${{ matrix.app }}
    # Every image for both CPUs: amd64 (laptops, CI) and arm64 (the Oracle host, D-15). On PRs they are only
    # built; on main they are pushed to GitHub's registry, tagged with the commit SHA, for deploy.yml to pull.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: config-server,    context: backend,      args: "MODULE=platform/config-server\nPORT=8888" }
          - { app: discovery-server, context: backend,      args: "MODULE=platform/discovery-server\nPORT=8761" }
          - { app: identity-service, context: backend,      args: "MODULE=services/identity-service\nPORT=8081" }
          - { app: booking-service,  context: backend,      args: "MODULE=services/booking-service\nPORT=8082" }
          - { app: api-gateway,      context: backend,      args: "MODULE=platform/api-gateway\nPORT=8080" }
          - { app: web,              context: frontend,     args: "" }
          - { app: backup,           context: infra/backup, args: "" }
    steps:
      - uses: actions/checkout@v7

      # QEMU runs the small arm64 runtime stages; the Maven and npm stages run natively ($BUILDPLATFORM).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/chhavinath-bit/gridreserve-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/chhavinath-bit/gridreserve-${{ matrix.app }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  system-tests:
    name: System tests (Compose, two booking instances)
    # The whole stack in Docker, then the browser end-to-end tests (M1.13), CONC-10 through the gateway
    # (M1.8) and the resilience scenarios that stop or kill containers (M1.9). Runs after the unit and
    # integration tests and the frontend checks pass, on PRs and main.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same layout as a laptop: the config repo next to the app repo (Compose mounts ../../gridreserve-config).
      - uses: actions/checkout@v7
        with:
          path: GridReserve

      # A milestone's config changes live on a config-repo branch with the same name as the app branch
      # (CLAUDE.md §14.1); use it while both PRs are open, otherwise main. The branch name is passed as an
      # environment variable, never pasted into the script, so a branch name can't inject commands.
      - name: Pick the config branch
        id: config
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/chhavinath-bit/gridreserve-config.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: chhavinath-bit/gridreserve-config
          ref: ${{ steps.config.outputs.ref }}
          path: gridreserve-config

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: GridReserve/backend/**/pom.xml

      # Random DB passwords and a fresh JWT key pair for this runner only; nothing is committed or printed.
      - name: Prepare a throwaway environment
        run: GridReserve/scripts/ci/prepare-system-test-env.sh

      - name: Start the stack with two booking-service instances
        working-directory: GridReserve/infra
        run: docker compose up -d --build --scale booking-service=2 --wait

      # Playwright against the fresh stack, before the system tests stop and start containers. It builds the
      # app and serves it with `vite preview` on :5173 (the origin the dev config trusts for refresh), which
      # proxies /api to the gateway. Only Chromium is installed, with the OS libraries it needs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: GridReserve/frontend/.nvmrc
          cache: npm
          cache-dependency-path: GridReserve/frontend/package-lock.json

      - name: Run the end-to-end tests
        working-directory: GridReserve/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            GridReserve/frontend/playwright-report
            GridReserve/frontend/test-results
          retention-days: 7

      # gridreserve.config.dir: the runner's throwaway config copy, which the refresh test (US-13) may edit.
      - name: Run the system tests
        working-directory: GridReserve/backend
        run: ./mvnw -B -pl system-tests -Psystem-tests verify -Dgridreserve.config.dir="$GITHUB_WORKSPACE/gridreserve-config"

      - name: Show service logs on failure
        if: failure()
        working-directory: GridReserve/infra
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        working-directory: GridReserve/infra
        run: docker compose down
