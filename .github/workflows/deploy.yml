name: Deploy

# Deployment to the Oracle Always Free host (M1.10, D-15), started by hand only (owner decision 2026-11-11):
# Actions → Deploy → Run workflow. It releases one commit's images (pushed by CI on main) on the host over
# SSH, then smoke-tests the public address from here. Merging to main never deploys by itself.
# Rollback: the same button with an older commit SHA; its images are still in GitHub's registry.
#
# Repository settings (Settings → Secrets and variables → Actions), described in docs/deploy/oracle.md:
#   variables: DEPLOY_HOST (public IP), DEPLOY_USER (SSH user), DEPLOY_SITE (e.g. 203-0-113-5.sslip.io)
#   secrets:   DEPLOY_SSH_KEY (private key of a deploy-only key pair), DEPLOY_KNOWN_HOSTS (the host's key line),
#              SMOKE_PASSWORD (password of the smoke-test account)
# Until DEPLOY_HOST is set, the job is skipped.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA to deploy (images must exist). Empty = the latest commit on main.
        required: false

permissions:
  contents: read
  actions: read   # to check that CI passed for the commit being released

# One deploy at a time; a second one waits instead of cancelling a release halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release on the host and smoke-test
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # The tag goes through an environment variable, never pasted into the script, so input can't inject commands.
      - name: Pick the commit to release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          tag="${INPUT_TAG:-$MAIN_SHA}"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only a commit whose CI passed on main has its images in the registry, tested. Refuse anything else
      # before touching the host, with a clear message instead of a failed image pull halfway.
      - name: Check that CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$TAG" --limit 1 --json conclusion --jq '.[0].conclusion // "none"')"
          [ "$conclusion" = "success" ] || { echo "CI on main for $TAG: $conclusion (needs success); not deploying"; exit 1; }
          echo "CI on main passed for $TAG"

      # The files of that same commit, so a rollback also gets its matching compose file.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # A pinned host key: the job refuses to talk to anything pretending to be the host.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the release files
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$TARGET" 'mkdir -p /opt/gridreserve/postgres'
          scp "${ssh_opts[@]}" infra/compose.prod.yaml "$TARGET:/opt/gridreserve/compose.yaml"
          scp "${ssh_opts[@]}" infra/postgres/init-databases.sh "$TARGET:/opt/gridreserve/postgres/init-databases.sh"
          scp "${ssh_opts[@]}" scripts/prod/release.sh scripts/refresh-config.sh "$TARGET:/opt/gridreserve/"

      - name: Release
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          TAG: ${{ steps.release.outputs.tag }}
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" "/opt/gridreserve/release.sh $TAG"

      # From outside the host: the app works, and nothing but 80/443 answers.
      - name: Smoke test
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 scripts/smoke-test.py "https://${{ vars.DEPLOY_SITE }}" --host "${{ vars.DEPLOY_HOST }}"
