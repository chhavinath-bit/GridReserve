# Settings that running services get from the Config Server (gridreserve-config/booking-service.yml).
# Tests start without it (CONFIG_IMPORT points here), so the values they depend on are copied here.
# Keep them in step with the config repo; the A-25 defaults (REQUIREMENTS §13).
gridreserve:
  service-client:
    id: booking-service
    secret: test-client-secret   # tests only; real secrets come from the environment

spring:
  cloud:
    openfeign:
      client:
        config:
          # Every Feign client (RES-01). Per-client keys are the client's context ID, so "default" is safest.
          default:
            connect-timeout: 1000
            read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: false
        # Our request was wrong (4xx) or our own bulkhead was full: not a sign identity is failing.
        ignore-exceptions:
          - com.gridreserve.booking.client.IdentityErrors$IdentityRejectedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  retry:
    instances:
      identity-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Only failures a second try can fix: identity's 5xx and network errors or timeouts.
        retry-exceptions:
          - com.gridreserve.booking.client.IdentityErrors$IdentityUnavailableException
          - feign.RetryableException
  ratelimiter:
    configs:
      default:
        limit-for-period: 20   # RES-05: per instance, per second
        limit-refresh-period: 1s
        timeout-duration: 0
  bulkhead:
    instances:
      identity-service:
        max-concurrent-calls: 10   # RES-04
        max-wait-duration: 0

management:
  endpoint:
    health:
      # RES-08: details (circuit-breaker states included) for admins only.
      show-details: when-authorized
      roles: ADMIN
