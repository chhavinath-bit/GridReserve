# Only identity and bootstrap settings live here; everything else comes from the Config Server
# (gridreserve-config/booking-service*.yml).
server:
  port: 8082

spring:
  application:
    name: booking-service
  config:
    # Running apps always import from the Config Server. CONFIG_IMPORT exists only so tests can
    # start without one (they set it to an optional empty location).
    import: "${CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  cloud:
    config:
      fail-fast: true
  # Correctness settings that must hold in every environment, tests included, so they live here and
  # not in the config repo (owner decision 2026-11-05). Flyway alone changes the schema; Hibernate
  # only validates that the entities match it and refuses to start otherwise.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Bounded, named scheduler (CLAUDE.md §8.3, ARCHITECTURE §10): 2 threads "gr-sched-*". On shutdown,
  # running jobs get up to 20 s to finish; each job item is its own transaction, so stopping is safe.
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: gr-sched-
      shutdown:
        await-termination: true
        await-termination-period: 20s
  lifecycle:
    timeout-per-shutdown-phase: 20s
