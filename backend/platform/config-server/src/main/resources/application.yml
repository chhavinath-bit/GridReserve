# The Config Server's own settings stay local: it is the thing that serves everyone else's config.
server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        # prod (default): Git backend reading the public GitHub repo. Never secrets in it.
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/chhavinath-bit/gridreserve-config}
          default-label: ${CONFIG_REPO_LABEL:main}
          clone-on-start: true
        # dev (profile "native"): read the YAML files straight from the local clone, read-only,
        # whatever branch is checked out there (uncommitted edits included). Git-backed "file:" URIs
        # are not used because the server would work inside the folder (lock files, checkouts).
        native:
          search-locations: ${CONFIG_NATIVE_LOCATION:file:${user.home}/Developer/project/gridreserve-config/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
